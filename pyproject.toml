[project]
name = "kalauz"
version = "0.1.0"
description = "Processing and mapping of railway temporary speed restrictions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4~=4.13.5",
    "geojson~=3.2.0",
    "lxml~=5.3.0",
    "mysql-connector-python~=9.4.0",
    "numpy~=2.3.2",
    "openpyxl~=3.1.5",
    "overpy~=0.7",
    "pandas~=2.3.2",
    "plum-dispatch~=2.5.7",
    "pydeck~=0.9.1",
    "pypdf~=4.3.1",
    "pyproj~=3.7.2",
    "python-dotenv~=1.1.1",
    "regex-spm~=1.0.0",
    "requests~=2.32.5",
    "rich~=13.7.1",
    "roman~=4.2",
    "scikit-learn~=1.7.1",
    "shapely~=2.1.1",
    "SQLAlchemy~=2.0.43",
    "tenacity~=9.1.2",
    "xlrd~=2.0.2",
]

[project.optional-dependencies]
dev = [
    "black~=25.1.0",
    "lxml-stubs~=0.5.1",
    "mypy~=1.17.1",
    "pandas-stubs~=2.3.2.250827",
    "types-beautifulsoup4~=4.12.0.20250516",
    "types-openpyxl~=3.1.5.20250822",
    "types-pytz~=2025.2.0.20250809",
    "types-requests~=2.32.4.20250809",
    "types-shapely~=2.1.0.20250822",
]

[tool.uv]
package = false
